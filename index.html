    <!-- Bandeau cookies — consentement Google Analytics -->
    <div id="cookie-banner" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;max-width:680px;margin:0 auto;background:#4A0E15;color:#F5E6D3;border:1px solid #C5A059;border-radius:14px;padding:14px 18px;font-family:Lato,system-ui,sans-serif;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.45);flex-wrap:wrap;align-items:center;gap:10px">
      <span style="flex:1 1 240px;line-height:1.45">Nous utilisons Google Analytics pour mesurer l’audience du site. Acceptez-vous ces cookies ?</span>
      <span style="display:flex;gap:8px;margin-left:auto">
        <button id="cookie-refuse" type="button" style="background:transparent;color:#F5E6D3;border:1px solid #F5E6D3;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:13px">Refuser</button>
        <button id="cookie-accept" type="button" style="background:#C5A059;color:#4A0E15;border:none;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;font-size:13px">Accepter</button>
      </span>
    </div>
    <script>
      (function () {
        try { if (localStorage.getItem('cookie-consent')) return; } catch (e) { return; }
        var b = document.getElementById('cookie-banner');
        b.style.display = 'flex';
        document.getElementById('cookie-accept').onclick = function () {
          localStorage.setItem('cookie-consent', 'granted'); b.remove(); window.__loadGA();
        };
        document.getElementById('cookie-refuse').onclick = function () {
          localStorage.setItem('cookie-consent', 'denied'); b.remove();
        };
      })();
    </script>
